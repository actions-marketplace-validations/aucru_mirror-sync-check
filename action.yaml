name: 'Verify Gitea Mirror Sync'
description: 'Verify Gitea mirrors against GitHub upstream branches and trigger synchronization when behind.'
author: 'Hang.J'

inputs:
  gitea-url:
    description: 'Gitea Url'
    required: true
  gitea-owner:
    description: 'Gitea mirror repo owner'
    required: true
  gitea-repo:
    description: 'Gitea mirror repo name'
    required: true
  gitea-token:
    description: 'Gitea access token'
    required: true
  branch:
    description: 'Git branch to verify'
    required: false
    default: 'main'
  upstream-owner:
    description: 'Upstream repo owner'
    required: true
  upstream-repo:
    description: 'Upstream repo name'
    required: true
  upstream-token:
    description: 'Optional GitHub token for the upstream repo; omit for anonymous access to public repos'
    required: false
  max-retries:
    description: 'Max retries'
    required: false
    default: '20'
  retry-interval:
    description: 'Seconds to wait between attempts'
    required: false
    default: '15'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: "refresh-cw"
  color: "green"
